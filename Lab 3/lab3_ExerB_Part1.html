<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Exercise B: Part 1 -->
    <!-- Error 1 (Line 1): Incomplete DOCTYPE tag -->
    <!-- Error 2 (Line 9): Misplaced </span> and </h1> tags; should be <h1>…</h1><span>…</span> -->
    <!-- Error 3 (Line 11): <span id="content"> used as a block container (wrong element), should be <div id="content">…</div> -->
    <!-- Error 4 (Line 13): Unescaped ampersand in "students &amp staff" — should be "students &amp; staff" -->
    <!-- Error 5 (Line 14): Total calculation uses string concatenation: adult.value + child.value gives "23" for 2 and 3. Must convert to numbers: Number(adult.value) + Number(child.value) -->
    <!-- Error 6 (Line 18): Invalid input type "emial" (typo) — should be type="email", and the field should have "required" so "myemail" is rejected -->
    <!-- Error 7 (Lines 22-23): <input list="movies"> points to non-existent id; the datalist is id="movielist". They must match (e.g. list="movielist") -->
    <!-- Error 8 (Line 23): Datalist options are not closed with </option> (invalid markup) -->
    <!-- Error 9 (Line 32): Range slider min="5" max="1" is reversed (min must be < max), should be min="1" max="5" -->
    <!-- Error 10 (Line 33): <output for="adult kid"> references wrong id "kid", should be for="adult child" -->
    <!-- Error 11 (Line 38): &Copy; is not a valid entity (case-sensitive), should be &copy; -->
    <!-- Error 12 (Lines 41/54-55): Duplicate closing body and html tags at end of file -->
    <title>Ticket Booking</title>
</head>
<body>
    <div id="header">
        <h1>e-Ticket <span>Your Campus Cinema</span></h1>
    </div>

    <div id="content">
        <h2>Book Your Ticket</h2>
        <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>

        <form action="booking.html" method="post" oninput="total.value = Number(adult.value) + Number(child.value)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="date">Show date:</label>
            <input type="date" id="date" name="date"><br>

            <label for="movie">Movie:</label>
            <input id="movie" name="movie" list="movielist"><br>
            <datalist id="movielist">
                <option value="Space Rangers"></option>
                <option value="Kampung Comedy"></option>
            </datalist>

            <label for="adult">Adult tickets:</label>
            <input type="number" id="adult" name="adult" value="0" min="0"><br>

            <label for="child">Child tickets:</label>
            <input type="number" id="child" name="child" value="0" min="0"><br>

            <label for="rating">Rate our service:</label>
            <input type="range" id="rating" name="rating" min="1" max="5"><br>

            Total tickets: <output name="total" for="adult child"></output><br>
            <input type="submit" value="Book Now">
        </form>
    </div>

    <div id="footer">
        <p>&copy; 2026 CineKampus. All rights reserved.</p>
    </div>

</body>
</html>
